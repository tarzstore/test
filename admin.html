<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Tarz Store</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#050505;--surface:#0d0d0d;--card:#111111;--card2:#161616;
    --text:#f2f2f5;--text2:#a3a3a3;--green:#00e5a0;--red:#ff5c5c;
    --border:rgba(255,255,255,.08);--radius:14px;
  }
  body{
    background:var(--bg);color:var(--text);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:20px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:22px;margin-bottom:4px;}
  .sub{color:var(--text2);font-size:13px;margin-bottom:24px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;
  }
  label{display:block;font-size:13px;color:var(--text2);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input,textarea,select{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);
    background:var(--card2);color:var(--text);font-size:15px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green);}
  button{
    cursor:pointer;border:none;border-radius:10px;padding:12px 18px;
    font-size:15px;font-weight:600;font-family:inherit;
  }
  .btn-primary{
    background:var(--green);color:#05170f;width:100%;margin-top:18px;
  }
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  #loginView, #adminView{display:none;}
  #loginView.show, #adminView.show{display:block;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .logout-btn{background:var(--card2);color:var(--text2);padding:8px 14px;font-size:13px;border:1px solid var(--border);}
  .product-item{
    display:flex;gap:12px;align-items:center;padding:12px;
    border:1px solid var(--border);border-radius:12px;margin-bottom:10px;
    background:var(--card2);
  }
  .product-item img{
    width:52px;height:52px;border-radius:8px;object-fit:cover;background:#222;flex-shrink:0;
  }
  .product-item .info{flex:1;min-width:0;}
  .product-item .info h4{font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .product-item .info p{font-size:12px;color:var(--text2);}
  .product-item .actions{display:flex;gap:6px;}
  .product-item .actions button{padding:8px 10px;font-size:12px;}
  .msg{
    padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;display:none;
  }
  .msg.show{display:block;}
  .msg.error{background:rgba(255,92,92,.12);color:var(--red);border:1px solid rgba(255,92,92,.3);}
  .msg.success{background:rgba(0,229,160,.1);color:var(--green);border:1px solid rgba(0,229,160,.3);}
  .section-title{font-size:15px;font-weight:600;margin:24px 0 12px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;}
  .empty{color:var(--text2);font-size:13px;text-align:center;padding:24px 0;}
  .preview-thumb{margin-top:8px;width:80px;height:80px;border-radius:8px;object-fit:cover;display:none;background:#222;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#05170f;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="wrap">

  <!-- ═══ LOGIN VIEW ═══ -->
  <div id="loginView" class="show">
    <h1>Admin Panel</h1>
    <p class="sub">Tarz Store — Kelola Produk</p>
    <div class="card">
      <div id="loginMsg" class="msg error"></div>
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@tarzstore.com" autocomplete="username">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">Masuk</button>
    </div>
  </div>

  <!-- ═══ ADMIN VIEW ═══ -->
  <div id="adminView">
    <div class="top-bar">
      <div>
        <h1>Kelola Produk</h1>
        <p class="sub" id="whoami">—</p>
      </div>
      <button class="logout-btn" onclick="doLogout()">Keluar</button>
    </div>

    <div id="formMsg" class="msg"></div>

    <div class="card">
      <div id="formTitle" style="font-weight:600;margin-bottom:6px;">Tambah Produk Baru</div>
      <input type="hidden" id="editId" value="">

      <label>Nama Produk</label>
      <input type="text" id="fName" placeholder="Contoh: KURAMA MODS">

      <label>Tab</label>
      <select id="fTab">
        <option value="freefire">Free Fire</option>
        <option value="allgame">All Game</option>
      </select>

      <label>URL Foto</label>
      <input type="text" id="fImageUrl" placeholder="https://... (link gambar produk)" oninput="onImageUrlInput()">
      <img id="fImagePreview" class="preview-thumb">

      <label>List Fitur</label>
      <textarea id="fFeatures" placeholder="Satu fitur per baris, contoh:&#10;AIM BOT&#10;ESP LINE&#10;ATHENA"></textarea>

      <label>Link Mediafire</label>
      <input type="text" id="fDownloadLink" placeholder="https://www.mediafire.com/...">

      <label>Platform</label>
      <select id="fPlatform">
        <option value="android">Android</option>
        <option value="pc">PC</option>
        <option value="ios">iOS</option>
      </select>

      <label>Key <span style="opacity:.6;">(opsional)</span></label>
      <input type="text" id="fCopyKey" placeholder="Contoh: kurama-proxy-XVHND66NBX">

      <label>Get Key <span style="opacity:.6;">(opsional, link eksternal untuk ambil key)</span></label>
      <input type="text" id="fGetKeyLink" placeholder="https://...">

      <div class="row" style="margin-top:18px;">
        <button class="btn-ghost" id="cancelEditBtn" onclick="resetForm()" style="display:none;">Batal Edit</button>
        <button class="btn-primary" id="saveBtn" onclick="saveProduct()" style="margin-top:0;">Simpan Produk</button>
      </div>
    </div>

    <div class="section-title">Daftar Produk (<span id="productCount">0</span>)</div>
    <div id="productList"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ═══════════════════════════════════════════════════
   KONFIGURASI SUPABASE
   ═══════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://bvblcdnmbzncoqeoqkoc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_II7ZGSsImxo10OqzRy3U4A_JWQ4rg46';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);



/* ═══════════════════════════════════════════════════
   AUTH: LOGIN / LOGOUT / CEK SESSION
   ═══════════════════════════════════════════════════ */
async function checkSession(){
  const { data:{ session } } = await db.auth.getSession();
  if(session){
    showAdminView(session.user.email);
  } else {
    showLoginView();
  }
}

function showLoginView(){
  document.getElementById('loginView').classList.add('show');
  document.getElementById('adminView').classList.remove('show');
}

function showAdminView(email){
  document.getElementById('loginView').classList.remove('show');
  document.getElementById('adminView').classList.add('show');
  document.getElementById('whoami').textContent = email;
  loadProducts();
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('loginBtn');

  msg.classList.remove('show');
  if(!email || !password){
    msg.textContent = 'Isi email dan password dulu ya.';
    msg.classList.add('show','error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Masuk...';

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Masuk';

  if(error){
    msg.textContent = 'Login gagal: ' + (error.message === 'Invalid login credentials' ? 'Email atau password salah.' : error.message);
    msg.classList.add('show','error');
    return;
  }

  showAdminView(data.user.email);
}

async function doLogout(){
  await db.auth.signOut();
  showLoginView();
}

/* ═══════════════════════════════════════════════════
   PREVIEW GAMBAR DARI URL
   ═══════════════════════════════════════════════════ */
function onImageUrlInput(){
  const url = document.getElementById('fImageUrl').value.trim();
  const preview = document.getElementById('fImagePreview');
  if(url){
    preview.src = url;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

/* ═══════════════════════════════════════════════════
   CRUD PRODUK
   ═══════════════════════════════════════════════════ */
function showFormMsg(text, type){
  const el = document.getElementById('formMsg');
  el.textContent = text;
  el.className = 'msg show ' + type;
  setTimeout(()=> el.classList.remove('show'), 4000);
}

/* Ubah textarea List Fitur (satu baris = satu fitur) jadi array bersih */
function parseFeatures(text){
  return text.split('\n').map(s => s.trim()).filter(Boolean);
}

async function saveProduct(){
  const btn = document.getElementById('saveBtn');
  const name = document.getElementById('fName').value.trim();
  const tab = document.getElementById('fTab').value;
  const image_url = document.getElementById('fImageUrl').value.trim();
  const features = parseFeatures(document.getElementById('fFeatures').value);
  const download_link = document.getElementById('fDownloadLink').value.trim();
  const platform = document.getElementById('fPlatform').value;
  const copy_key = document.getElementById('fCopyKey').value.trim();
  const get_key_link = document.getElementById('fGetKeyLink').value.trim();
  const editId = document.getElementById('editId').value;

  if(!name){
    showFormMsg('Nama produk wajib diisi.', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Menyimpan...';

  try{
    const payload = {
      name,
      tab,
      image_url: image_url || null,
      features,
      download_link,
      platform,
      copy_key: copy_key || null,
      get_key_link: get_key_link || null,
      // price tetap diisi (kolom lama wajib not-null di database), tidak ditampilkan di form
      price: ''
    };

    let error;
    if(editId){
      ({ error } = await db.from('products').update(payload).eq('id', editId));
    } else {
      ({ error } = await db.from('products').insert(payload));
    }

    if(error) throw new Error(error.message);

    showFormMsg(editId ? 'Produk berhasil diperbarui.' : 'Produk berhasil ditambahkan.', 'success');
    resetForm();
    loadProducts();
  } catch(err){
    showFormMsg(err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Simpan Produk';
  }
}

function resetForm(){
  document.getElementById('editId').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fTab').value = 'freefire';
  document.getElementById('fImageUrl').value = '';
  document.getElementById('fFeatures').value = '';
  document.getElementById('fDownloadLink').value = '';
  document.getElementById('fPlatform').value = 'android';
  document.getElementById('fCopyKey').value = '';
  document.getElementById('fGetKeyLink').value = '';
  document.getElementById('fImagePreview').style.display = 'none';
  document.getElementById('formTitle').textContent = 'Tambah Produk Baru';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

async function loadProducts(){
  const listEl = document.getElementById('productList');
  listEl.innerHTML = '<p class="empty">Memuat produk...</p>';

  const { data, error } = await db
    .from('products')
    .select('*')
    .order('created_at', { ascending: false });

  if(error){
    listEl.innerHTML = '<p class="empty">Gagal memuat produk: ' + error.message + '</p>';
    return;
  }

  document.getElementById('productCount').textContent = data.length;

  if(data.length === 0){
    listEl.innerHTML = '<p class="empty">Belum ada produk. Tambahkan lewat form di atas.</p>';
    return;
  }

  const tabLabel = { freefire: 'Free Fire', allgame: 'All Game' };

  listEl.innerHTML = data.map(p => `
    <div class="product-item">
      <img src="${p.image_url || ''}" onerror="this.style.opacity=0">
      <div class="info">
        <h4>${escapeHtml(p.name)}</h4>
        <p>${escapeHtml(tabLabel[p.tab] || p.tab || '')} · ${escapeHtml(p.platform || '')}</p>
      </div>
      <div class="actions">
        <button class="btn-ghost" onclick="editProduct('${p.id}')">Edit</button>
        <button class="btn-danger" onclick="deleteProduct('${p.id}')">Hapus</button>
      </div>
    </div>
  `).join('');

  window._productsCache = data;
}

function editProduct(id){
  const p = (window._productsCache || []).find(x => x.id === id);
  if(!p) return;

  document.getElementById('editId').value = p.id;
  document.getElementById('fName').value = p.name || '';
  document.getElementById('fTab').value = p.tab || 'freefire';
  document.getElementById('fImageUrl').value = p.image_url || '';
  document.getElementById('fFeatures').value = Array.isArray(p.features) ? p.features.join('\n') : '';
  document.getElementById('fDownloadLink').value = p.download_link || '';
  document.getElementById('fPlatform').value = p.platform || 'android';
  document.getElementById('fCopyKey').value = p.copy_key || '';
  document.getElementById('fGetKeyLink').value = p.get_key_link || '';
  const preview = document.getElementById('fImagePreview');
  if(p.image_url){
    preview.src = p.image_url;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
  document.getElementById('formTitle').textContent = 'Edit Produk: ' + p.name;
  document.getElementById('cancelEditBtn').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deleteProduct(id){
  if(!confirm('Yakin mau hapus produk ini? Tindakan ini tidak bisa dibatalkan.')) return;

  const { error } = await db.from('products').delete().eq('id', id);
  if(error){
    showFormMsg('Gagal menghapus: ' + error.message, 'error');
    return;
  }
  showFormMsg('Produk berhasil dihapus.', 'success');
  loadProducts();
}

function escapeHtml(str){
  if(!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */
checkSession();

document.getElementById('loginPassword').addEventListener('keydown', e=>{
  if(e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
