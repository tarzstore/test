function log(msg){
  document.getElementById('log').textContent += msg + '\n';
}

async function runMigration(){
  const btn = document.getElementById('runBtn');
  btn.disabled = true;

  const { data:{ session } } = await db.auth.getSession();
  if(!session){
    log('❌ Kamu belum login. Buka admin.html di tab lain, login dulu, lalu refresh halaman ini.');
    btn.disabled = false;
    return;
  }
  log('✅ Login terverifikasi sebagai ' + session.user.email);
  log('Mulai migrasi ' + PRODUCTS_SEED.length + ' produk...\n');

  let success = 0, fail = 0;
  for(const p of PRODUCTS_SEED){
    const { error } = await db.from('products').insert(p);
    if(error){
      log('❌ Gagal: ' + p.name + ' — ' + error.message);
      fail++;
    } else {
      log('✅ Berhasil: ' + p.name);
      success++;
    }
  }

  log('\n=== SELESAI: ' + success + ' berhasil, ' + fail + ' gagal ===');
  btn.textContent = 'Migrasi Selesai';
}
